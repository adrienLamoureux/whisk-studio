# AI review of each pull request against AGENTS.md, CONTRIBUTING.md and the 500-line cap.
#
# Secrets: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`), as in dev-kit.yml, so runs count
# against your Claude plan, not an API balance. Nothing else.
# Only PRs from branches of this repo are reviewed: the repo is public and fork PRs get no secrets.
# The Claude GitHub App token is checked against the workflow file on main, so the PR that adds
# or edits this file fails its own review run. That is expected; later PRs run normally.

name: PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI review
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      # The Action stops at Claude's first final result, so a background subagent would be cut off.
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request (#${{ github.event.pull_request.number }}).
            Apply the rules in AGENTS.md and CONTRIBUTING.md, including the 500-line
            cap per source file. Flag correctness bugs, security issues, missing tests
            and any file that grows past 500 lines. Be concise, comment inline where
            possible, and do not request stylistic changes that lint and prettier cover.
            Post inline comments with the inline-comment tool and one short summary
            with `gh pr comment`.
          claude_args: >-
            --max-turns 8
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*)"
